# ============================================================================
# cv-tok-analysis tokenizer family (CV-DE-trained, used by cv-tok-w2v-ft-es)
# 8 trainable variants from the 9-way tokenizer-comparison study. SP models
# are the v2 retrains on the new ASR-input format (phones concat within a
# word, single space at word boundary, `|` between syllables inside a word).
# Enum-vocab tokenizers (de_phon_atom, de_phon_atom_fused, de_syl200_phn)
# use the new enum_phone_tokenizer family.
# ============================================================================

# Ortho-BPE: plain BPE on raw German lowercased text (5000 vocab).
name: de_ortho_bpe
tokenizer_family: char_tokenizer
tokenizer: /nfs1/scratch/students/witzlch88229/data/omni-asr-ft/cv_analysis/tokenizers/txt_bpe.model

---
# Ortho-syllabified BPE (PSC): pyphen-syllabified text + `-` UDS (5000 vocab).
name: de_ortho_syl
tokenizer_family: syllable_tokenizer
tokenizer: /nfs1/scratch/students/witzlch88229/data/omni-asr-ft/cv_analysis/tokenizers/psc_bpe.model

---
# Phon-free (PPC-BPE v2): BPE over phones concat within word, word-boundary
# space — cross-syllable merges allowed (no `|` UDS). Vocab=4096.
name: de_phon_free
tokenizer_family: char_tokenizer
tokenizer: /nfs1/scratch/students/witzlch88229/data/omni-asr-ft/cv_analysis/tokenizers/ppc_bpe_v2.model

---
# Phon-bound (PP+SL-BPE v2): BPE over phones with `|` UDS between syllables
# (no cross-syllable merges) + word-boundary space. Vocab=4096.
name: de_phon_bound
tokenizer_family: char_tokenizer
tokenizer: /nfs1/scratch/students/witzlch88229/data/omni-asr-ft/cv_analysis/tokenizers/pp_sl_bpe_v2.model

---
# Phon-atom (P+SL): enumeration vocab — atomic SAMPA phones + `|` syllable
